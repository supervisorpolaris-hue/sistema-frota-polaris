<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  /* Identidade Polaris Entregas: degradê #FD4502 → #FCA102, preto/grafite, Montserrat. Tema claro fixo. */
  :root {
    color-scheme: light;
    --brand-1: #fd4502;
    --brand-2: #fca102;
    --grad: linear-gradient(135deg, #fd4502 0%, #fb7a06 55%, #fca102 100%);
    --btn: linear-gradient(135deg, #ef4304 0%, #f57a06 100%);
    --page: #f6f2ee;
    --surface: #ffffff;
    --surface-2: #faf7f4;
    --ink: #1a1a1a;
    --ink-2: #57524d;
    --muted: #8e8680;
    --line: #ece5de;
    --grid: #efe9e3;
    --accent: #d23f00;
    --soft: #fff1e6;
    --bar: #f26a0a;
    --bar-2: #5b6470;
    --good: #138a13; --good-soft: #e6f5e6; --good-bar: #22a822;
    --warn: #9a5800; --warn-soft: #fff3d9; --warn-bar: #f2a20c;
    --crit: #c62e2e; --crit-soft: #fde8e8;
    --info: #2a5db0; --info-soft: #e8f0fd;
    --shadow: 0 1px 2px rgba(60, 30, 10, .05), 0 4px 14px rgba(60, 30, 10, .06);
    --r: 16px;
    --font: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --tabbar: 64px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--ink); font: 15px/1.45 var(--font);
    -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1;
    padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 12px);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  /* ---------- barra do topo ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .appbar-in { max-width: 1040px; margin: 0 auto; height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 10px; }
  .appbar .logo-mark { height: 32px; flex: none; }
  .appbar .logo-word { height: 24px; flex: none; }
  .appbar h1 { font-size: 17px; margin: 0; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .sp { flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--ink-2);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }

  main { max-width: 1040px; margin: 0 auto; padding: 14px 14px 8px; }
  section.view { animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- menu de baixo ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 18px rgba(60, 30, 10, .06);
  }
  .tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar); }
  .tab {
    border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative;
  }
  .tab .i { width: 24px; height: 24px; }
  .tab[aria-current="true"] { color: var(--accent); }
  .tab[aria-current="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--grad); }
  .tab .dot { position: absolute; top: 8px; left: 56%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--brand-1); color: #fff; font-size: 10px; line-height: 17px; font-weight: 800; }

  /* ---------- tela de abertura ---------- */
  .splash { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .35s, visibility .35s; }
  .splash .logo-mark { height: 104px; animation: pulse 1.6s ease-in-out infinite; }
  .splash .logo-word { height: 54px; background-position: center; }
  .splash .tagline { margin: 0; font-weight: 700; font-style: italic; letter-spacing: .02em; font-size: 14px; }
  .splash.out { opacity: 0; visibility: hidden; }
  @keyframes pulse { 50% { transform: scale(.94); opacity: .85; } }

  /* ---------- blocos gerais ---------- */
  .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px 2px 10px; }
  .sec-title h2 { font-size: 16px; font-weight: 800; margin: 0; }
  .sec-title .link { font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 760px) { .grid-md-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-md-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .cols { display: grid; gap: 14px; }
  @media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }

  /* ---------- início: cabeçalho laranja ---------- */
  .hero { background: var(--grad); color: #fff; border-radius: 22px; padding: 18px 18px 16px; position: relative; overflow: hidden; box-shadow: 0 10px 26px rgba(239, 67, 4, .28); }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
  .hero .hello { font-size: 20px; font-weight: 800; margin: 0; }
  .hero .date { font-size: 13px; opacity: .92; margin: 2px 0 14px; }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: relative; z-index: 1; }
  .hero-stat { background: rgba(255, 255, 255, .18); border-radius: 14px; padding: 10px; }
  .hero-stat b { display: block; font-size: 20px; font-weight: 800; line-height: 1.1; }
  .hero-stat span { font-size: 11px; font-weight: 600; opacity: .95; }

  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 4px; }
  .quick button {
    border: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 4px 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ink);
  }
  .quick .ic { width: 42px; height: 42px; border-radius: 13px; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .quick button:active { transform: scale(.97); }

  /* alertas */
  .alerts { display: flex; flex-direction: column; gap: 8px; }
  .alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); border-left: 4px solid var(--info); cursor: default; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; width: 100%; }
  .alert.has-action { cursor: pointer; }
  .alert .ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--info-soft); color: var(--info); }
  .alert .ic .i { width: 18px; height: 18px; }
  .alert b { display: block; font-size: 14px; }
  .alert span { font-size: 13px; color: var(--ink-2); }
  .alert.crit { border-left-color: var(--crit); } .alert.crit .ic { background: var(--crit-soft); color: var(--crit); }
  .alert.warn { border-left-color: var(--warn-bar); } .alert.warn .ic { background: var(--warn-soft); color: var(--warn); }
  .alert .go { margin-left: auto; color: var(--muted); align-self: center; }

  /* escala */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .person { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 5px; box-shadow: var(--shadow); font-size: 13px; font-weight: 600; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--accent); font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .person .st { font-size: 11px; font-weight: 700; }
  .person .st.on { color: var(--good); } .person .st.off { color: var(--muted); }

  /* seletor de período / segmentos */
  .seg { display: flex; background: #ece6e0; border-radius: 12px; padding: 3px; gap: 2px; overflow-x: auto; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .period-bar { position: sticky; top: 56px; z-index: 10; background: var(--page); padding: 10px 0 6px; margin-top: 12px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; min-width: 0; }
  .kpi .l { font-size: 12px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .kpi .l .i { width: 15px; height: 15px; color: var(--accent); }
  .kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v.pos { color: var(--good); } .kpi .v.neg { color: var(--crit); }
  .delta { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }
  .delta.up { background: var(--good-soft); color: var(--good); }
  .delta.down { background: var(--crit-soft); color: var(--crit); }
  .delta.flat { background: #f0ece8; color: var(--muted); }
  .kpi .s { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .kpi.big { grid-column: span 2; background: var(--surface); }

  /* insights */
  .insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .insights li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .insights .b { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; font-weight: 800; font-size: 13px; }
  .insights .good .b { background: var(--good-soft); color: var(--good); }
  .insights .bad .b { background: var(--crit-soft); color: var(--crit); }
  .insights .info .b { background: var(--info-soft); color: var(--info); }

  /* gráficos */
  .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .chart-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap .axis { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .chart-wrap .gl { stroke: var(--grid); stroke-width: 1; }
  .chart-wrap .hit { fill: transparent; }
  .chart-wrap .vl { fill: var(--ink-2); font-size: 11px; font-weight: 700; font-family: var(--font); }
  .chart-wrap .on { opacity: .72; }
  .tip { position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.4; white-space: nowrap; transform: translate(-50%, -100%); }

  /* frota */
  .motos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .moto { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; position: relative; overflow: hidden; }
  .moto::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--grad); }
  .moto .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .moto .id { font-size: 17px; font-weight: 800; }
  .moto .km { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 2px; }
  .moto .km small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .moto .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .moto .row b { color: var(--ink); }
  .bar { height: 7px; background: var(--grid); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .bar span { display: block; height: 100%; background: var(--good-bar); border-radius: 999px; }
  .bar.warn span { background: var(--warn-bar); } .bar.crit span { background: var(--crit); }

  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .pill.ok { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.crit { background: var(--crit-soft); color: var(--crit); }
  .pill.muted { background: #f0ece8; color: var(--muted); }
  .pill.run { background: var(--soft); color: var(--accent); }

  /* ranking */
  .rank { display: flex; flex-direction: column; gap: 12px; }
  .rank-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
  .rank-row .pos { font-weight: 800; color: var(--muted); text-align: center; }
  .rank-row .pos.top { color: var(--accent); }
  .rank-row .nm { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-row .meta { font-size: 12px; color: var(--muted); }
  .rank-row .num { text-align: right; font-weight: 800; }
  .rank-row .num small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .mini-bar { height: 5px; background: var(--grid); border-radius: 999px; margin-top: 5px; overflow: hidden; }
  .mini-bar span { display: block; height: 100%; background: var(--bar); border-radius: 999px; }

  /* ---------- listas ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
  .item.click { cursor: pointer; }
  .item .main { flex: 1; min-width: 0; }
  .item .t { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { font-size: 12px; color: var(--muted); }
  .item .r { text-align: right; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .item .r small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .item .links a { font-size: 12px; font-weight: 700; margin-right: 10px; text-decoration: none; }
  .item .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }

  .menu { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .menu button, .menu a { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none; }
  .menu > :last-child { border-bottom: 0; }
  .menu .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
  .menu small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .menu .chev { margin-left: auto; color: var(--muted); }

  /* ---------- formulários ---------- */
  form.card { padding: 16px; }
  .form-title { font-size: 17px; font-weight: 800; margin: 0 0 14px; }
  .fields { display: grid; gap: 14px; }
  @media (min-width: 760px) { .fields.two { grid-template-columns: 1fr 1fr; } .fields .full { grid-column: 1 / -1; } }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .field > .lb { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .req { color: var(--accent); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 13px; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 16px;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand-1); background: #fff; box-shadow: 0 0 0 3px rgba(253, 69, 2, .12); }
  .hint { font-size: 12px; color: var(--muted); min-height: 16px; }
  .hint.warn { color: var(--warn); } .hint.err { color: var(--crit); }
  .input-row { display: flex; gap: 8px; align-items: stretch; }
  .input-row input { flex: 1; min-width: 0; }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 14px; min-height: 44px; cursor: pointer; font-weight: 700; font-size: 14px; text-align: left; }
  .opt small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .opt[aria-pressed="true"] { background: var(--btn); border-color: transparent; color: #fff; }
  .opt[aria-pressed="true"] small { color: rgba(255, 255, 255, .9); }
  .opt.sm { min-height: 34px; padding: 5px 11px; font-size: 13px; font-weight: 600; border-radius: 999px; }
  .check-opt[aria-pressed="false"] { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); }
  .check-opt[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good-bar); color: var(--good); }

  .photo-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; min-height: 48px; padding: 0 13px;
    border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 13px; border: 1.5px dashed var(--brand-1); color: var(--accent); background: var(--soft);
  }
  .photo-btn input { display: none; }
  .photo.has .photo-btn { border-style: solid; }
  .photo-prev { position: relative; margin-top: 8px; }
  .photo-prev img { display: block; width: 100%; max-height: 200px; object-fit: contain; background: #111; border-radius: 12px; cursor: zoom-in; }
  .photo-prev .x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .65); color: #fff; cursor: pointer; font-size: 15px; }

  .calc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: var(--soft); border-radius: 12px; padding: 12px; border-left: 4px solid var(--brand-1); }
  .calc div { font-size: 11px; color: var(--ink-2); font-weight: 700; }
  .calc b { display: block; font-size: 17px; color: var(--ink); }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); }
  .btn.primary { flex: 1; background: var(--btn); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(239, 67, 4, .28); }
  .btn.sm { min-height: 38px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
  .btn.ghost { border-color: transparent; background: var(--soft); color: var(--accent); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn .i { width: 18px; height: 18px; }

  .note { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink); }

  /* entregador */
  .profile { display: flex; align-items: center; gap: 14px; }
  .profile .avatar { width: 58px; height: 58px; font-size: 20px; background: var(--grad); color: #fff; }
  .profile h2 { margin: 0; font-size: 19px; font-weight: 800; }
  .stats-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stats-3 div { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; }
  .stats-3 b { display: block; font-size: 18px; color: var(--ink); }
  .doc { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .doc:last-child { border-bottom: 0; }
  .doc .main { flex: 1; min-width: 0; }
  .doc .t { font-weight: 700; font-size: 14px; }
  .doc .s { font-size: 12px; color: var(--muted); }
  .doc label.btn { cursor: pointer; }
